# Produktiv-Stack pro Kunde: App (Dockerfile-Build) + PostgreSQL
# Variablen kommen aus --env-file (siehe .env.production.example bzw. scripts/provision-customer.sh):
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
# Multi-Kunden-VPS: CUSTOMER + APP_PORT pro Kunde setzen → mehrere Stacks nebeneinander.
name: kassensystem-${CUSTOMER:-default}

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      # Compose-interne DB — DB_SSL=false, weil der Postgres-Container kein SSL kann
      DATABASE_URL: postgres://${POSTGRES_USER:-posuser}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt (env-file)}@db:5432/${POSTGRES_DB:-posdb}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET fehlt (env-file)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      # Keine Cookies (Bearer-Token im Header) → "*" ist OK; APK-Origin ist http://localhost (Capacitor)
      CORS_ORIGIN: "*"
    ports:
      - "${APP_PORT:-5000}:5000"
    volumes:
      - uploads:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-posuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt (env-file)}
      POSTGRES_DB: ${POSTGRES_DB:-posdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  uploads:
