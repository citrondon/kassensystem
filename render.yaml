services:
  - type: web
    name: kassensystem
    runtime: node
    plan: free
    buildCommand: |
      rm -rf frontend/dist backend/dist backend/dist-static
      cd backend && npm install --include=dev && npm run build
      cd ../frontend && npm install --include=dev && npm run build
      cp -r ../frontend/dist ../backend/dist-static
    # DO NOT run seedUsers here — users are created via setup flow or settings panel
    startCommand: cd backend && node scripts/migrate.cjs up && node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: JWT_SECRET
        generateValue: true
      # Token-Laufzeit (Default "8h" im Code, hier explizit dokumentiert)
      - key: JWT_EXPIRES_IN
        value: "8h"
      - key: CORS_ORIGIN
        value: "*"
      # Render Free Postgres: keine vertrauenswürdige CA → expliziter SSL-Insecure-Opt-out
      - key: DB_SSL_INSECURE
        value: "true"
      # ACHTUNG: Zugangsdaten nicht im Repo committen — stattdessen Render Env-Gruppe/Secret verwenden
      - key: DATABASE_URL
        sync: false
